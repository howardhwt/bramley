# DSperate settings for the Bramley spike on the TrimUI Brick.
#
# run.sh copies this file to .userdata/tg5040/NDS-dsperate/dsperate/dsperate.ini
# the first time DSperate runs, filling in the __NAMES__ below. After that the
# copy is DSperate's own: its pause menu writes to it. Delete the copy to seed
# it again from this file.
#
# Per game, DSperate writes the layout and the swap to
# .userdata/tg5040/NDS-dsperate/dsperate/games/<rom name>.ini when they are
# changed with the hotkeys, so each game remembers its own.
#
# Every key and its default is in DSperate's configs/default.ini (v3.3.0).

[paths]
# No BIOS is needed: without these files DSperate boots games with its
# built-in FreeBIOS and a generated firmware, as melonDS does.
bios9 = __BIOS__/bios9.bin
bios7 = __BIOS__/bios7.bin
firmware = __BIOS__/firmware.bin
games = __ROMS__
# A folder of its own under Saves/NDS, so DSperate's <rom>.sav never meets
# melonDS's <rom>.sav in Saves/NDS.
saves = __SAVES__
states = __STATES__
screenshots = __SCREENSHOTS__
cheats = __CHEATS__

[video]
fullscreen = true
# Stacked is the default for every game. The cycle is Bramley's four layouts:
# stacked, side by side, one screen, and large plus small (dominant_h, which
# puts the DS screens at 3x and 1x on the 1024x768 panel).
layout = vertical
layout_cycle = vertical,horizontal,single,dominant_h
screen = top
# Whole panel pixels per DS pixel: stacked 2x, side by side 2x, one screen 4x.
integer_scale = under
# The frames-per-second counter, on for the measurement. MENU+Y turns it off
# and on (see [padhotkeys] fps).
fps = true

[audio]
# The Brick has no microphone DSperate can open.
mic = false

[emu]
# Measure without frame skipping, so the counter shows the real speed.
# spruceOS and the NextUI DSperate pak ship frameskip = 1 (adaptive).
frameskip = 0
# Save a state on quit and on the launcher's SIGTERM, and resume it next time.
autosave = true
autoload = true
# Upstream DSperate names states after the four-letter game code
# (<CODE>.auto.dss, <CODE>.<slot>.dss), so two ROMs of one game, such as a
# translation and its original, share state slots.

# The Brick's pad, through the SDL mapping run.sh exports. SDL names the face
# buttons by position, so the DS's A is SDL's "b" (east), as in the defaults.
[pad]
# The Brick's SDL mapping already matches the button positions. Without this,
# DSperate compares it with the kernel's codes (TrimUI uses Xbox codes under
# Nintendo labels) and would wrongly swap A and B.
face_fix = off
# Hold R2: the D-pad moves the pen. While R2 is held, A touches the screen and
# holding A drags. A alone is still the DS's A (this needs the spike patch
# dsperate-stylus-tap-under-hold.patch; without it A would only ever touch).
stylus_hold = +righttrigger
stylus_button = b
stylus_axis = none
# Pen pixels per frame while a direction is held (DSperate has no acceleration).
stylus_speed = 4.0
# Hide the pen half a second after it stops moving.
stylus_hide = 30

[hotkeys]
# No keyboard on the Brick.
quit = none

# MENU is the modifier ("guide" in the SDL mapping).
[padhotkeys]
modifier = guide
# A tap of MENU alone opens DSperate's pause menu (its Quit item leaves).
pause.alt = mod
pause = none
# L2 alone swaps the two screens.
screen_swap = +lefttrigger
# MENU + Left or Right cycles the layouts.
layout_next = mod+dpright
layout_prev = mod+dpleft
# MENU + START moves the small screen of the pip layout to the next corner.
pip_corner_next = mod+start
# MENU + Y (SDL's x, west) shows or hides the fps counter.
fps = mod+x
# MENU + SELECT quits straight away, a safety exit for the spike.
quit = mod+back
# Off: they sat on the chords above or on R2, or are not in the design.
fast_forward = none
fast_forward_toggle = none
save_state = none
load_state = none
slot_next = none
slot_prev = none
screenshot = none
mic = none
lid = none

[cheevos]
enabled = false
